  <!-- AGENTE IA — Flowise com botão nativo reposicionado -->
  <style>
    flowise-chatbot::part(button),
    flowise-chatbot > button,
    #flowise-chatbot-bubble-button {
      bottom: 80px !important;
      left: 14px !important;
      right: auto !important;
      width: 36px !important;
      height: 36px !important;
      opacity: 0 !important;
      pointer-events: all !important;
      z-index: 9998 !important;
    }
  </style>

  <script type="module">
    import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js";
    Chatbot.init({
      chatflowid: "e0364731-8312-41c9-9454-fee9ad657b7d",
      apiHost: "https://cloud.flowiseai.com",
      theme: {
        button: {
          backgroundColor: "#1d4ed8",
          right: 9999,
          bottom: 80,
          size: 36,
          iconColor: "#ffffff"
        },
        chatWindow: {
          welcomeMessage: "Ol\u00e1! \ud83d\udc4b Como posso ajudar hoje?",
          backgroundColor: "#ffffff",
          height: 520,
          width: 380,
          fontSize: 14,
          title: "Agente GV\u0026T",
          titleColor: "#ffffff",
          titleBackgroundColor: "#1d4ed8"
        }
      }
    });

    window.addEventListener("load", function() {
      var attempts = 0;
      var interval = setInterval(function() {
        attempts++;
        var host = document.querySelector("flowise-chatbot");
        if (!host) { if (attempts > 30) clearInterval(interval); return; }

        var shadow = host.shadowRoot;
        if (!shadow) { if (attempts > 30) clearInterval(interval); return; }

        var btn = shadow.querySelector("button");
        if (!btn) { if (attempts > 30) clearInterval(interval); return; }

        clearInterval(interval);

        btn.style.cssText = "position:fixed!important;bottom:80px!important;left:14px!important;right:auto!important;opacity:0!important;width:36px!important;height:36px!important;z-index:9998!important;";

        var iaBtn = document.getElementById("ia-toggle-btn");
        if (iaBtn) {
          iaBtn.addEventListener("click", function() {
            btn.click();
          });
        }

      }, 200);
    });
  </script>

  <script src="config.js"></script>
  <script src="script.js"></script>
