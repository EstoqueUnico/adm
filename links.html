<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="logo.png" />
  <script src="https://kit.fontawesome.com/a2e0e6ad46.js" crossorigin="anonymous" defer></script>
</head>
<body data-page="links">

  <div id="progress-bar"></div>
  <div id="spinner"><div class="spinner-ring"></div></div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="logo.png" alt="Logo GV&T" class="sidebar-logo-img" />
      <div class="sidebar-title">GV&amp;T<span>Intranet do Setor</span></div>
    </div>
    <nav class="sidebar-nav">
      <p class="nav-section-label">Menu</p>
      <ul style="list-style:none">
        <li class="nav-item"><a href="index.html" class="nav-link" data-tooltip="Início"><i class="fas fa-home"></i><span>Início</span></a></li>
        <li class="nav-item"><a href="comunicados.html" class="nav-link" data-tooltip="Comunicados"><i class="fas fa-bullhorn"></i><span>Comunicados</span></a></li>
        <li class="nav-item"><a href="downloads.html" class="nav-link" data-tooltip="Downloads"><i class="fas fa-download"></i><span>Downloads</span></a></li>
        <li class="nav-item"><a href="treinamentos.html" class="nav-link" data-tooltip="Treinamentos"><i class="fas fa-graduation-cap"></i><span>Treinamentos</span></a></li>
        <li class="nav-item"><a href="equipe.html" class="nav-link" data-tooltip="Equipe"><i class="fas fa-users"></i><span>Equipe</span></a></li>
        <li class="nav-item"><a href="links.html" class="nav-link active" data-tooltip="Links"><i class="fas fa-link"></i><span>Links</span></a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-toggle-btn" id="sidebar-toggle" title="Recolher menu">
        <i class="fas fa-chevron-left"></i><span>Recolher</span>
      </button>
    </div>
  </aside>

  <div class="main-content">
    <header class="top-header">
      <h1>Links Úteis</h1>
      <div class="header-actions">
        <div class="search-wrap">
          <i class="fas fa-search"></i>
          <input id="search" type="search" placeholder="Buscar na página..." oninput="globalSearch()" />
        </div>
        <div id="datetime"></div>
        <button class="theme-btn" id="theme-toggle" title="Alternar tema"></button>
      </div>
    </header>
    <div class="page-content">
      <div id="links-list"></div>
    </div>
  </div>



  <!-- AGENTE IA — painel flutuante com iframe Flowise -->
  <div id="ia-panel" style="
    display:none;
    position:fixed;
    bottom:24px;
    left:270px;
    width:380px;
    height:540px;
    background:#fff;
    border-radius:16px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
    z-index:9990;
    overflow:hidden;
    flex-direction:column;
    border:1px solid #e2e6f0;
    transition:left .2s ease;
  ">
    <div style="
      background:linear-gradient(135deg,#1d4ed8,#6366f1);
      color:#fff;
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-family:'DM Sans',sans-serif;
      font-weight:600;
      font-size:.9rem;
      flex-shrink:0;
    ">
      <div style="display:flex;align-items:center;gap:8px">
        <i class="fas fa-robot"></i>
        <span>Agente GV&amp;T</span>
      </div>
      <button onclick="toggleIA()" style="
        background:rgba(255,255,255,.2);
        border:none;
        color:#fff;
        border-radius:6px;
        width:28px;height:28px;
        cursor:pointer;
        font-size:.9rem;
        display:flex;align-items:center;justify-content:center;
      "><i class="fas fa-times"></i></button>
    </div>
    <iframe
      id="ia-iframe"
      src=""
      data-src="https://cloud.flowiseai.com/chatbot/e0364731-8312-41c9-9454-fee9ad657b7d"
      style="flex:1;border:none;width:100%;height:100%"
      allow="microphone"
    ></iframe>
  </div>

  <script>
    (function() {
      var iaOpen = false;
      var iaLoaded = false;

      window.toggleIA = function() {
        var panel = document.getElementById("ia-panel");
        var iframe = document.getElementById("ia-iframe");
        if (!panel) return;

        iaOpen = !iaOpen;
        panel.style.display = iaOpen ? "flex" : "none";

        // Carrega o iframe apenas na primeira abertura
        if (iaOpen && !iaLoaded) {
          iframe.src = iframe.dataset.src;
          iaLoaded = true;
        }

        // Ajusta posição se sidebar estiver recolhida
        var collapsed = document.body.classList.contains("sidebar-collapsed");
        panel.style.left = collapsed ? "80px" : "270px";
      };

      // Ajusta posição quando sidebar é recolhida/expandida
      document.addEventListener("DOMContentLoaded", function() {
        var btn = document.getElementById("ia-toggle-btn");
        if (btn) btn.addEventListener("click", toggleIA);

        var toggleBtn = document.getElementById("sidebar-toggle");
        if (toggleBtn) {
          toggleBtn.addEventListener("click", function() {
            setTimeout(function() {
              var panel = document.getElementById("ia-panel");
              if (!panel || panel.style.display === "none") return;
              var collapsed = document.body.classList.contains("sidebar-collapsed");
              panel.style.left = collapsed ? "80px" : "270px";
            }, 250);
          });
        }
      });
    })();
  </script>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
