  <!-- AGENTE IA — Flowise embed oficial controlado pelo botão da sidebar -->
  <script>
    (function() {
      var iaOpen = false;
      var iaLoaded = false;

      function loadFlowise() {
        if (iaLoaded) return;
        iaLoaded = true;

        var script = document.createElement("script");
        script.type = "module";
        script.textContent = [
          "import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js";",
          "Chatbot.init({",
          "  chatflowid: "e0364731-8312-41c9-9454-fee9ad657b7d",",
          "  apiHost: "https://cloud.flowiseai.com",",
          "  theme: {",
          "    button: { backgroundColor: "#1d4ed8", right: 9999, bottom: 9999, size: 0 },",
          "    chatWindow: {",
          "      welcomeMessage: "Ol\u00e1! \ud83d\udc4b Como posso ajudar hoje?",",
          "      backgroundColor: "#ffffff",",
          "      height: 520,",
          "      width: 380,",
          "      fontSize: 14,",
          "      title: "Agente GV\u0026T",",
          "      titleColor: "#ffffff",",
          "      titleBackgroundColor: "#1d4ed8"",
          "    }",
          "  }",
          "});",
          "window._flowiseChatbot = Chatbot;"
        ].join("
");
        document.body.appendChild(script);
      }

      function openFlowise() {
        // Tenta acionar o botão interno do web component
        var tryClick = function(attempts) {
          var host = document.querySelector("flowise-chatbot");
          var btn = host && host.shadowRoot && host.shadowRoot.querySelector("button[part=button], button.chatbot-button, button");
          if (btn) {
            btn.click();
            return;
          }
          if (attempts > 0) setTimeout(function(){ tryClick(attempts - 1); }, 200);
        };
        tryClick(15);
      }

      window.toggleIA = function() {
        if (!iaLoaded) {
          loadFlowise();
          // Aguarda o componente montar antes de clicar
          setTimeout(function(){ openFlowise(); }, 1200);
        } else {
          openFlowise();
        }
        iaOpen = !iaOpen;
      };

      document.addEventListener("DOMContentLoaded", function() {
        var btn = document.getElementById("ia-toggle-btn");
        if (btn) btn.addEventListener("click", window.toggleIA);
      });
    })();
  </script>

  <script src="config.js"></script>
